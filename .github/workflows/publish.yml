name: Publish Package

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  linux-gnu: # {{{
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
            sysroot_arch: amd64
            sysroot_url: https://github.com/microsoft/vscode-linux-build-agent/releases/download/v20260212-405735/x86_64-linux-gnu-glibc-2.28-gcc-10.5.0.tar.gz
            sysroot_sha256: ac4b6b14b4cec027a22a51bbbb049b3504958a78106c8a8d5cec144206b767d1
            test: true
          - target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
            sysroot_arch: arm64
            sysroot_url: https://github.com/microsoft/vscode-linux-build-agent/releases/download/v20260212-405735/aarch64-linux-gnu-glibc-2.28-gcc-10.5.0.tar.gz
            sysroot_sha256: 38fa5acc4e4f17cb7e3f599b5226a511b22cbdceeb38277d224b45f7280f518f
          - target: armv7-unknown-linux-gnueabihf
            package: linux-arm-gnueabihf
            sysroot_arch: armhf
            sysroot_url: https://github.com/microsoft/vscode-linux-build-agent/releases/download/v20260212-405735/arm-rpi-linux-gnueabihf-glibc-2.28-gcc-10.5.0.tar.gz
            sysroot_sha256: a0a1573e93191ae5e3735eb6107f4daeb4be7f99c5af229114d990ac77db33eb
          - target: powerpc64le-unknown-linux-gnu
            package: linux-ppc64le-gnu
            sysroot_arch: ppc64el
            sysroot_url: https://github.com/VSCodium/vscode-linux-build-agent/releases/download/v20260706/powerpc64le-linux-gnu-glibc-2.28-gcc-10.5.0.tar.gz
            sysroot_sha256: 2d1a21d3ed310a62e229f056839cccd52c96c7d7c63542b7ba7c34ff20a3f832
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Install sysroot
        env:
          SYSROOT_ARCH: ${{ matrix.sysroot_arch }}
          SYSROOT_URL: ${{ matrix.sysroot_url }}
          SYSROOT_SHA256: ${{ matrix.sysroot_sha256 }}
        run: |
          set -e
          archive="$RUNNER_TEMP/sysroot.tar.gz"
          curl -sSfL "$SYSROOT_URL" -o "$archive"
          echo "$SYSROOT_SHA256  $archive" | sha256sum --check
          mkdir -p "/tmp/vscodium-$SYSROOT_ARCH-sysroot"
          tar -xzf "$archive" -C "/tmp/vscodium-$SYSROOT_ARCH-sysroot"

      - name: Generate wasm2c C
        run: |
          set -e
          archive="$RUNNER_TEMP/wabt.tar.gz"
          curl -sSfL "https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz" -o "$archive"
          echo "83f8122e924745fcd70636e3594bc01c4c47f2d4c8f3c63b5d70d3f83a482677  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wabt" pac-wasm-guest/generated
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/wabt"
          "$RUNNER_TEMP/wabt/bin/wasm2c" pac-wasm-guest/pac_guest.wasm --module-name pac_guest \
            -o pac-wasm-guest/generated/pac_guest.c

      - name: Build addon
        env:
          OS_PROXY_RESOLVER_PAC_GUEST_C_DIR: pac-wasm-guest/generated
        run: npm/scripts/build-linux-native.sh "$TARGET"

      - name: Test addon
        if: matrix.test
        run: npm run test:npm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/os_proxy_resolver.node
          if-no-files-found: error
  # }}}

  linux-musl: # {{{
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            package: linux-x64-musl
          - target: aarch64-unknown-linux-musl
            package: linux-arm64-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Generate wasm2c C
        run: |
          set -e
          archive="$RUNNER_TEMP/wabt.tar.gz"
          curl -sSfL "https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz" -o "$archive"
          echo "83f8122e924745fcd70636e3594bc01c4c47f2d4c8f3c63b5d70d3f83a482677  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wabt" pac-wasm-guest/generated
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/wabt"
          "$RUNNER_TEMP/wabt/bin/wasm2c" pac-wasm-guest/pac_guest.wasm --module-name pac_guest \
            -o pac-wasm-guest/generated/pac_guest.c

      - name: Build addon
        env:
          OS_PROXY_RESOLVER_PAC_GUEST_C_DIR: pac-wasm-guest/generated
        run: |
          set -e
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              sudo apt-get update
              sudo apt-get install -yq musl-dev musl-tools
              sudo ln -sf /usr/bin/g++ /usr/bin/musl-g++
              compiler=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CXX_x86_64_unknown_linux_musl=musl-g++
              ;;
            aarch64-unknown-linux-musl)
              toolchain_root="$RUNNER_TEMP/aarch64-linux-musl"
              toolchain_archive="$RUNNER_TEMP/aarch64-linux-musl-gcc-10.3.0.tar.gz"
              mkdir -p "$toolchain_root"
              curl -sSfL "https://github.com/microsoft/vscode-linux-build-agent/releases/download/v20260212-405735/aarch64-linux-musl-gcc-10.3.0.tar.gz" \
                -o "$toolchain_archive"
              echo "58cd59ee4038291fe8a7f4adccac0ecbe8d23cbad1cb650b381e45e7e1e22424  $toolchain_archive" | sha256sum --check
              tar -xzf "$toolchain_archive" -C "$toolchain_root"
              compiler="$toolchain_root/output/bin/aarch64-linux-musl-gcc"
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$compiler"
              export CC_aarch64_unknown_linux_musl="$compiler"
              export CXX_aarch64_unknown_linux_musl="$toolchain_root/output/bin/aarch64-linux-musl-g++"
              ;;
          esac

          libgcc=$("$compiler" -print-libgcc-file-name)
          libgcc_eh="$(dirname "$libgcc")/libgcc_eh.a"
          libgcc_shim="$RUNNER_TEMP/musl-libgcc"
          mkdir -p "$libgcc_shim"
          printf 'GROUP ( %s %s )\n' "$libgcc" "$libgcc_eh" > "$libgcc_shim/libgcc_s.so"
          target_env=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${target_env}_RUSTFLAGS=-C link-arg=-L$libgcc_shim"

          node npm/scripts/build-native.js "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/os_proxy_resolver.node
          if-no-files-found: error
  # }}}

  linux-cross: # {{{
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: riscv64gc-unknown-linux-gnu
            package: linux-riscv64-gnu
          - target: loongarch64-unknown-linux-gnu
            package: linux-loong64-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Generate wasm2c C
        run: |
          set -e
          archive="$RUNNER_TEMP/wabt.tar.gz"
          curl -sSfL "https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-linux-x64.tar.gz" -o "$archive"
          echo "83f8122e924745fcd70636e3594bc01c4c47f2d4c8f3c63b5d70d3f83a482677  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wabt" pac-wasm-guest/generated
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/wabt"
          "$RUNNER_TEMP/wabt/bin/wasm2c" pac-wasm-guest/pac_guest.wasm --module-name pac_guest \
            -o pac-wasm-guest/generated/pac_guest.c

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build addon
        env:
          CARGO_BUILD_COMMAND: cross
          OS_PROXY_RESOLVER_PAC_GUEST_C_DIR: pac-wasm-guest/generated
        run: node npm/scripts/build-native.js "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/os_proxy_resolver.node
          if-no-files-found: error
  # }}}

  macos: # {{{
    name: build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: darwin-x64
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Install wasm2c
        run: |
          set -e
          if [ "$(uname -m)" = "arm64" ]; then
            archive="$RUNNER_TEMP/wabt.tar.gz"
            curl -sSfL "https://github.com/WebAssembly/wabt/releases/download/1.0.41/wabt-1.0.41-macos-arm64.tar.gz" -o "$archive"
            echo "e5269d6bbe05dfeb179e4f21111b3a641d6ccaa38b0b21d472ae5c65f8c4ff5d  $archive" | shasum -a 256 --check
            mkdir -p "$RUNNER_TEMP/wabt"
            tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/wabt"
            echo "OS_PROXY_RESOLVER_WASM2C=$RUNNER_TEMP/wabt/bin/wasm2c" >> "$GITHUB_ENV"
          else
            brew install wabt
          fi

      - name: Build addon
        run: node npm/scripts/build-native.js "$TARGET"

      - name: Test addon
        run: npm run test:npm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/os_proxy_resolver.node
          if-no-files-found: error
  # }}}

  windows: # {{{
    name: build ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: win32-x64-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: win32-arm64-msvc
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Build addon
        shell: bash
        run: node npm/scripts/build-native.js "$TARGET"

      - name: Test addon
        shell: bash
        run: npm run test:npm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: npm/platforms/${{ matrix.package }}/os_proxy_resolver.node
          if-no-files-found: error
  # }}}

  publish: # {{{
    needs:
      - linux-gnu
      - linux-musl
      - linux-cross
      - macos
      - windows
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # NPM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: npm/platforms

      - name: Verify packages
        run: |
          set -e
          npm run verify:packages
          for directory in npm/platforms/*/; do
            test -f "${directory}os_proxy_resolver.node"
            cp LICENSE.txt npm/ThirdPartyNotices.txt "$directory"
          done

      - name: Publish platform packages to NPM Registry
        run: |
          set -e
          for directory in npm/platforms/*/; do
            npm publish "$directory" --verbose --tag latest --provenance --access=public
          done

      - name: Publish package to NPM Registry
        run: npm publish --verbose --tag latest --provenance --access=public
  # }}}
